version: '3.8'
services:
  neo4j:
    image: neo4j:5
    container_name: clinicalgit-neo4j
    ports:
      - '7474:7474'
      - '7687:7687'
    environment:
      # DEV ONLY: Hardcoded password for local development. Do not use in production.
      NEO4J_AUTH: neo4j/changeme
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
